[package]
name = "arcade-sim"
version = "0.1.0"
edition = "2021"
description = "Arcade Cabinet Fault Simulator — desktop shell"
license = "CC0-1.0"

[lib]
name = "arcade_sim_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri                  = { version = "2", features = [] }
tauri-plugin-shell     = "2"
tauri-plugin-dialog    = "2"
tauri-plugin-updater   = "2"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
tokio             = { version = "1", features = ["time", "rt", "sync"] }

[profile.release]
panic   = "abort"
codegen-units = 1
lto     = true
strip   = true
