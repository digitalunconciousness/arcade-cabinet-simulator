<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Arcade Fault Simulator</title>
  <style>
    :root {
      --bg: #0d1117;
      --fg: #c9d1d9;
      --fg-dim: #8b949e;
      --accent: #58a6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      user-select: none;
    }
    .logo {
      font-size: 1.5rem;
      letter-spacing: 0.04em;
      color: var(--fg);
      opacity: 0.9;
    }
    .logo span { color: var(--accent); }
    .message {
      font-size: 0.85rem;
      color: var(--fg-dim);
    }
    /* Pulsing dot spinner */
    .dots {
      display: flex;
      gap: 8px;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.2s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40%            { opacity: 1.0; transform: scale(1.0); }
    }
  </style>
</head>
<body>
  <div class="splash">
    <div class="logo">Arcade <span>Fault</span> Simulator</div>
    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <div class="message" id="msg">Starting simulator…</div>
  </div>
</body>
</html>
