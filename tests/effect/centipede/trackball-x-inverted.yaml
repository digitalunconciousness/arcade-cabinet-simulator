inject:
  at_frame: 400
  primitive: input_inverted
  params: {port: ":TRACK0_X", field: "Trackball X"}
expect:
  - ram_trend: {ram: sprites, offset: 0x1e, from_at: 440, to_at: 480}
  - frame_hash_differs: {from: 451, to: 599, min_fraction: 0.5}
  - not_crashed: {}
  - snapshot: {at: 480}
repair:
  at_frame: 600
  action: clear_and_hard_reset
expect_after_repair:
  - frame_hash_matches_baseline: {from: 601, to: 900}
