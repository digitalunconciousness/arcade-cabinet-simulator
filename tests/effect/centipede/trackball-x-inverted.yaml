id: centipede/trackball-x-inverted
title: Trackball X axis inverted (encoder phases swapped)
romset: centiped3
display: {rotate: 90}
tier: A
symptom: Rolling the trackball right moves the shooter left.
note: >
  The fault acts in the plugin's input layer, which every injected input passes through, and flips MAME's analog
  reverse for input from the host. The shooter's horizontal position was found by comparing runs with and without
  trackball motion: motion object 14's HPOS at 0x07DE (sprite RAM offset 0x1E) moved 127, 171, 216 to the right.
sources: [mame-centiped-inputs, cendef-motion-objects]
run:
  end_frame: 900
  checkpoints: [440, 480, 600, 900]
  ram:
    - {name: sprites, space: ":maincpu", start: 0x07c0, end: 0x07ff}
  events:
    - {frame: 300, type: button, port: ":IN1", field: "Coin 1", down: true}
    - {frame: 306, type: button, port: ":IN1", field: "Coin 1", down: false}
    - {frame: 360, type: button, port: ":IN1", field: "1 Player Start", down: true}
    - {frame: 366, type: button, port: ":IN1", field: "1 Player Start", down: false}
    # roll the trackball right, 3 counts a frame, for one second
    - {frame: 450, type: analog, port: ":TRACK0_X", field: "Trackball X", delta: 3}
    - {frame: 451, type: analog, port: ":TRACK0_X", field: "Trackball X", delta: 3}
    - {frame: 452, type: analog, port: ":TRACK0_X", field: "Trackball X", delta: 3}
