name: Release Nightly

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  create-nightly-release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.ensure-release.outputs.result }}
      nightly_version: ${{ steps.nightly-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute nightly version
        id: nightly-version
        run: |
          echo "version=0.1.0-nightly.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Ensure nightly prerelease exists
        id: ensure-release
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = 'nightly';

            try {
              const existing = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: existing.data.id,
                tag_name: tag,
                name: `Arcade Fault Simulator Nightly (${new Date().toISOString().slice(0, 10)})`,
                draft: false,
                prerelease: true,
                make_latest: 'false'
              });
              return String(existing.data.id);
            } catch (err) {
              const created = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: `Arcade Fault Simulator Nightly (${new Date().toISOString().slice(0, 10)})`,
                draft: false,
                prerelease: true,
                make_latest: 'false'
              });
              return String(created.data.id);
            }
          result-encoding: string

      - name: Remove prior nightly assets
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const releaseId = Number('${{ steps.ensure-release.outputs.result }}');
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner,
              repo,
              release_id: releaseId,
              per_page: 100,
            });
            for (const asset of assets) {
              await github.rest.repos.deleteReleaseAsset({
                owner,
                repo,
                asset_id: asset.id,
              });
            }

  release-linux-nightly:
    needs: create-nightly-release
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xvfb \
            python3 \
            python3-venv \
            python3-pip

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set up Python venv
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt pyinstaller

      - name: Add venv to PATH
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Apply nightly Tauri config
        run: |
          cp src-tauri/tauri.nightly.conf.json src-tauri/tauri.conf.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('src-tauri/tauri.conf.json')
          data = json.loads(p.read_text())
          data['version'] = '${{ needs.create-nightly-release.outputs.nightly_version }}'
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Build and publish nightly AppImage + deb
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ARCADE_SIM_CHANNEL: nightly
          NO_STRIP: "1"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          releaseId: ${{ needs.create-nightly-release.outputs.release_id }}

      - name: Smoke test sidecar binary
        run: python -m pytest tests/smoke/test_bundle.py -v

  release-windows-nightly:
    needs: create-nightly-release
    permissions:
      contents: write
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set up Python venv
        run: |
          python -m venv .venv
          .venv\Scripts\pip install --upgrade pip
          .venv\Scripts\pip install -r requirements.txt pyinstaller

      - name: Add venv to PATH
        run: echo "$env:GITHUB_WORKSPACE\.venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Append
        shell: pwsh

      - name: Apply nightly Tauri config
        shell: pwsh
        run: |
          Copy-Item src-tauri/tauri.nightly.conf.json src-tauri/tauri.conf.json -Force
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('src-tauri/tauri.conf.json')
          data = json.loads(p.read_text())
          data['version'] = '${{ needs.create-nightly-release.outputs.nightly_version }}'
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Build and publish nightly NSIS installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ARCADE_SIM_CHANNEL: nightly
        with:
          releaseId: ${{ needs.create-nightly-release.outputs.release_id }}

      - name: Smoke test sidecar binary
        run: python -m pytest tests/smoke/test_bundle.py -v
