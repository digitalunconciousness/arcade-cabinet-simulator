name: Release Nightly

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  create-nightly-release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.ensure-release.outputs.result }}
      nightly_version: ${{ steps.nightly-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Git identity for vendored patches
        shell: bash
        run: |
          git config --global user.name "Arcade Fault Simulator CI"
          git config --global user.email "ci@arcade-sim.invalid"

      - name: Ensure vendored MAME tree exists
        shell: bash
        run: |
          if [[ ! -d vendor/mame/plugins/cabinet_bus ]]; then
            git clone --depth=1 https://github.com/mamedev/mame.git vendor/mame
            for patch in "$GITHUB_WORKSPACE"/patches/*.patch; do
              if git -C vendor/mame apply --reverse --check "$patch" >/dev/null 2>&1; then
                echo "Skipping already-applied patch: $(basename "$patch")"
                continue
              fi

              git -C vendor/mame -c user.name="Arcade Fault Simulator CI" -c user.email="ci@arcade-sim.invalid" am -3 "$patch"
            done
          fi

      - name: Compute nightly version
        id: nightly-version
        run: |
          echo "version=0.1.0-nightly.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Ensure nightly prerelease exists
        id: ensure-release
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = 'nightly';

            try {
              const existing = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: existing.data.id,
                tag_name: tag,
                name: `Arcade Fault Simulator Nightly (${new Date().toISOString().slice(0, 10)})`,
                draft: false,
                prerelease: true,
                make_latest: 'false'
              });
              return String(existing.data.id);
            } catch (err) {
              const created = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: `Arcade Fault Simulator Nightly (${new Date().toISOString().slice(0, 10)})`,
                draft: false,
                prerelease: true,
                make_latest: 'false'
              });
              return String(created.data.id);
            }
          result-encoding: string

      - name: Remove prior nightly assets
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const releaseId = Number('${{ steps.ensure-release.outputs.result }}');
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner,
              repo,
              release_id: releaseId,
              per_page: 100,
            });
            for (const asset of assets) {
              await github.rest.repos.deleteReleaseAsset({
                owner,
                repo,
                asset_id: asset.id,
              });
            }

  release-linux-nightly:
    needs: create-nightly-release
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure Git identity for vendored patches
        shell: bash
        run: |
          git config --global user.name "Arcade Fault Simulator CI"
          git config --global user.email "ci@arcade-sim.invalid"

      - name: Ensure vendored MAME tree exists
        shell: bash
        run: |
          if [[ ! -d vendor/mame/plugins/cabinet_bus ]]; then
            git clone --depth=1 https://github.com/mamedev/mame.git vendor/mame
            for patch in "$GITHUB_WORKSPACE"/patches/*.patch; do
              if git -C vendor/mame apply --reverse --check "$patch" >/dev/null 2>&1; then
                echo "Skipping already-applied patch: $(basename "$patch")"
                continue
              fi

              git -C vendor/mame -c user.name="Arcade Fault Simulator CI" -c user.email="ci@arcade-sim.invalid" am -3 "$patch"
            done
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xvfb \
            python3 \
            python3-venv \
            python3-pip

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set up Python venv
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt pyinstaller pytest requests

      - name: Add venv to PATH
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Apply nightly Tauri config
        env:
          RELEASE_BASE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          cp src-tauri/tauri.nightly.conf.json src-tauri/tauri.conf.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          p = Path('src-tauri/tauri.conf.json')
          data = json.loads(p.read_text())
          data['version'] = '${{ needs.create-nightly-release.outputs.nightly_version }}'
          data['plugins']['updater']['endpoints'] = [
              f"{os.environ['RELEASE_BASE_URL']}/releases/download/nightly/latest.json"
          ]
          data['bundle']['resources'] = [
              r for r in data['bundle']['resources'] if (p.parent / r).exists()
          ]
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Build and publish nightly AppImage + deb
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCADE_SIM_CHANNEL: nightly
          NO_STRIP: "1"
          APPIMAGE_EXTRACT_AND_RUN: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-nightly-release.outputs.release_id }}

      - name: Smoke test sidecar binary
        run: python -m pytest tests/smoke/test_bundle.py -v

  release-windows-nightly:
    needs: create-nightly-release
    permissions:
      contents: write
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure Git identity for vendored patches
        shell: bash
        run: |
          git config --global user.name "Arcade Fault Simulator CI"
          git config --global user.email "ci@arcade-sim.invalid"

      - name: Ensure vendored MAME tree exists
        shell: bash
        run: |
          if [[ ! -d vendor/mame/plugins/cabinet_bus ]]; then
            git clone --depth=1 https://github.com/mamedev/mame.git vendor/mame
            for patch in "$GITHUB_WORKSPACE"/patches/*.patch; do
              if git -C vendor/mame apply --reverse --check "$patch" >/dev/null 2>&1; then
                echo "Skipping already-applied patch: $(basename "$patch")"
                continue
              fi

              git -C vendor/mame -c user.name="Arcade Fault Simulator CI" -c user.email="ci@arcade-sim.invalid" am -3 "$patch"
            done
          fi

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set up Python venv
        run: |
          python -m venv .venv
          .venv\Scripts\pip install --upgrade pip
          .venv\Scripts\pip install -r requirements.txt pyinstaller pillow pytest requests

      - name: Add venv to PATH
        run: echo "$env:GITHUB_WORKSPACE\.venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Append
        shell: pwsh

      - name: Generate Windows icon
        shell: pwsh
        run: |
          python -c 'from PIL import Image; img = Image.open("src-tauri/icons/icon.png"); img.save("src-tauri/icons/icon.ico", format="ICO", sizes=[(256,256),(128,128),(64,64),(32,32),(16,16)])'

      - name: Apply nightly Tauri config
        shell: pwsh
        env:
          RELEASE_BASE_URL: ${{ github.server_url }}/${{ github.repository }}
          NIGHTLY_VERSION: ${{ needs.create-nightly-release.outputs.nightly_version }}
        run: |
          Copy-Item src-tauri/tauri.nightly.conf.json src-tauri/tauri.conf.json -Force
          python -c 'import json, os, pathlib; p = pathlib.Path("src-tauri/tauri.conf.json"); data = json.loads(p.read_text()); data["version"] = os.environ["NIGHTLY_VERSION"]; data["plugins"]["updater"]["endpoints"] = [os.environ["RELEASE_BASE_URL"] + "/releases/download/nightly/latest.json"]; data["build"]["beforeBuildCommand"] = "bash build/pyinstaller/build.sh"; data["bundle"]["targets"] = ["nsis"]; data["bundle"]["resources"] = [r for r in data["bundle"]["resources"] if (p.parent / r).exists()]; p.write_text(json.dumps(data, indent=2) + "\n")'

      - name: Build and publish nightly NSIS installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCADE_SIM_CHANNEL: nightly
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-nightly-release.outputs.release_id }}

      - name: Smoke test nightly NSIS installer (silent install)
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Recurse -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Nightly NSIS installer not found under src-tauri/target/release/bundle/nsis"
          }

          $installDir = Join-Path $env:RUNNER_TEMP "arcade-sim-nightly-install"
          Remove-Item -Recurse -Force $installDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $installDir | Out-Null

          Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$installDir" -Wait -NoNewWindow

          $appExe = Get-ChildItem -Path $installDir -Recurse -Filter "*.exe" |
            Where-Object { $_.Name -notmatch "^uninstall" } |
            Select-Object -First 1

          if (-not $appExe) {
            Get-ChildItem -Path $installDir -Recurse | Format-Table -AutoSize
            throw "No installed nightly app executable found after NSIS silent install"
          }

          Write-Host "Nightly installer smoke test passed: $($appExe.FullName)"

      - name: Smoke test sidecar binary
        run: python -m pytest tests/smoke/test_bundle.py -v

  verify-nightly-assets:
    needs: [create-nightly-release, release-linux-nightly, release-windows-nightly]
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    steps:
      - name: Verify nightly release has expected assets
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const release_id = Number('${{ needs.create-nightly-release.outputs.release_id }}');

            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner,
              repo,
              release_id,
              per_page: 100,
            });

            const names = assets.map(a => a.name);
            const hasNsis = names.some(n => n.endsWith('-setup.exe'));
            const hasAppImage = names.some(n => n.endsWith('.AppImage'));
            const hasDeb = names.some(n => n.endsWith('.deb'));
            const hasLatestJson = names.includes('latest.json');

            if (!hasNsis || !hasAppImage || !hasDeb || !hasLatestJson) {
              core.setFailed(`Missing expected nightly assets. Found: ${names.join(', ')}`);
              return;
            }

            core.info(`Nightly asset verification OK (${names.length} assets).`);
