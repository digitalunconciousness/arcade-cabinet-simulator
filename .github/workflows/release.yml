name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

jobs:
  # ── Linux AppImage + .deb ───────────────────────────────────────────────────
  release-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xvfb \
            python3 \
            python3-venv \
            python3-pip

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set up Python venv
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt pyinstaller

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build AppImage + deb
        env:
          NO_STRIP: "1"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          source .venv/bin/activate
          cargo tauri build

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: arcade-fault-simulator-linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: arcade-fault-simulator-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb

      - name: Smoke test sidecar binary
        run: |
          source .venv/bin/activate
          python -m pytest tests/smoke/test_bundle.py -v

  # ── Windows NSIS installer ─────────────────────────────────────────────────
  release-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set up Python venv
        run: |
          python -m venv .venv
          .venv\Scripts\pip install --upgrade pip
          .venv\Scripts\pip install -r requirements.txt pyinstaller

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build NSIS installer
        run: |
          .venv\Scripts\activate
          cargo tauri build

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: arcade-fault-simulator-windows-setup
          path: src-tauri/target/release/bundle/nsis/*-setup.exe

      - name: Smoke test sidecar binary
        run: |
          .venv\Scripts\activate
          python -m pytest tests/smoke/test_bundle.py -v

  # ── GitHub Release — attach all artifacts ──────────────────────────────────
  publish:
    needs: [release-linux, release-windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist-artifacts/**/*
