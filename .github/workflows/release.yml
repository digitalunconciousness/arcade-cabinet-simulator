name: Release Stable

on:
  push:
    tags:
      - 'v[0-9]*'

jobs:
  # ── Create draft release first so both build jobs can upload to the same release ──
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Create draft GitHub release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Arcade Fault Simulator ${tag}`,
              draft: true,
              prerelease: false,
              generate_release_notes: true,
            });
            return data.id;
          result-encoding: string

  # ── Linux AppImage + .deb ───────────────────────────────────────────────────
  release-linux:
    needs: create-release
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure Git identity for vendored patches
        shell: bash
        run: |
          git config --global user.name "Arcade Fault Simulator CI"
          git config --global user.email "ci@arcade-sim.invalid"

      - name: Ensure vendored MAME tree exists
        shell: bash
        run: |
          if [[ ! -d vendor/mame/plugins/cabinet_bus ]]; then
            git clone --depth=1 https://github.com/mamedev/mame.git vendor/mame
            for patch in "$GITHUB_WORKSPACE"/patches/*.patch; do
              if git -C vendor/mame apply --reverse --check "$patch" >/dev/null 2>&1; then
                echo "Skipping already-applied patch: $(basename "$patch")"
                continue
              fi

              git -C vendor/mame -c user.name="Arcade Fault Simulator CI" -c user.email="ci@arcade-sim.invalid" am -3 "$patch"
            done
          fi

      - name: Apply host-aware stable updater endpoint
        env:
          RELEASE_BASE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          python -c "import json, os, pathlib; p = pathlib.Path('src-tauri/tauri.conf.json'); data = json.loads(p.read_text()); data['plugins']['updater']['endpoints'] = [f\"{os.environ['RELEASE_BASE_URL']}/releases/latest/download/latest.json\"]; data['build']['beforeBuildCommand'] = 'bash build/pyinstaller/build.sh'; p.write_text(json.dumps(data, indent=2) + '\\n')"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xvfb \
            python3 \
            python3-venv \
            python3-pip

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set up Python venv
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt pyinstaller

      - name: Add venv to PATH
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Build and publish AppImage + deb
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ARCADE_SIM_CHANNEL: stable
          NO_STRIP: "1"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}

      - name: Smoke test sidecar binary
        run: python -m pytest tests/smoke/test_bundle.py -v

  # ── Windows NSIS installer ─────────────────────────────────────────────────
  release-windows:
    needs: create-release
    permissions:
      contents: write
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure Git identity for vendored patches
        shell: bash
        run: |
          git config --global user.name "Arcade Fault Simulator CI"
          git config --global user.email "ci@arcade-sim.invalid"

      - name: Ensure vendored MAME tree exists
        shell: bash
        run: |
          if [[ ! -d vendor/mame/plugins/cabinet_bus ]]; then
            git clone --depth=1 https://github.com/mamedev/mame.git vendor/mame
            for patch in "$GITHUB_WORKSPACE"/patches/*.patch; do
              if git -C vendor/mame apply --reverse --check "$patch" >/dev/null 2>&1; then
                echo "Skipping already-applied patch: $(basename "$patch")"
                continue
              fi

              git -C vendor/mame -c user.name="Arcade Fault Simulator CI" -c user.email="ci@arcade-sim.invalid" am -3 "$patch"
            done
          fi

      - name: Apply host-aware stable updater endpoint
        env:
          RELEASE_BASE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          python -c "import json, os, pathlib; p = pathlib.Path('src-tauri/tauri.conf.json'); data = json.loads(p.read_text()); data['plugins']['updater']['endpoints'] = [f\"{os.environ['RELEASE_BASE_URL']}/releases/latest/download/latest.json\"]; p.write_text(json.dumps(data, indent=2) + '\\n')"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set up Python venv
        run: |
          python -m venv .venv
          .venv\Scripts\pip install --upgrade pip
          .venv\Scripts\pip install -r requirements.txt pyinstaller

      - name: Add venv to PATH
        run: echo "$env:GITHUB_WORKSPACE\.venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Append
        shell: pwsh

      - name: Build and publish NSIS installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ARCADE_SIM_CHANNEL: stable
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}

      - name: Smoke test NSIS installer (silent install)
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Recurse -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "NSIS installer not found under src-tauri/target/release/bundle/nsis"
          }

          $installDir = Join-Path $env:RUNNER_TEMP "arcade-sim-install"
          Remove-Item -Recurse -Force $installDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $installDir | Out-Null

          Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$installDir" -Wait -NoNewWindow

          $appExe = Get-ChildItem -Path $installDir -Recurse -Filter "*.exe" |
            Where-Object { $_.Name -notmatch "^uninstall" } |
            Select-Object -First 1

          if (-not $appExe) {
            Get-ChildItem -Path $installDir -Recurse | Format-Table -AutoSize
            throw "No installed app executable found after NSIS silent install"
          }

          Write-Host "Installer smoke test passed: $($appExe.FullName)"

      - name: Smoke test sidecar binary
        run: python -m pytest tests/smoke/test_bundle.py -v

  verify-release-assets:
    needs: [create-release, release-linux, release-windows]
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    steps:
      - name: Verify release has expected assets and updater metadata
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const release_id = Number('${{ needs.create-release.outputs.release_id }}');

            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner,
              repo,
              release_id,
              per_page: 100,
            });

            const names = assets.map(a => a.name);
            const hasNsis = names.some(n => n.endsWith('-setup.exe'));
            const hasAppImage = names.some(n => n.endsWith('.AppImage'));
            const hasDeb = names.some(n => n.endsWith('.deb'));
            const hasUpdaterJson = names.some(n => n.endsWith('latest.json'));

            if (!hasNsis || !hasAppImage || !hasDeb || !hasUpdaterJson) {
              core.setFailed(
                `Missing expected assets. Found: ${names.join(', ')}`
              );
              return;
            }

            core.info(`Release asset verification OK (${names.length} assets).`);

  # ── Publish: un-draft the release once both builds succeed ─────────────────
  publish-release:
    needs: [create-release, release-linux, release-windows, verify-release-assets]
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
            });
